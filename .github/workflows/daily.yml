name: daily candidates

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC; scheduled runs have started up to ten hours late, so leave room before the morning read
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and pre-filter
        env:
          FEWPAPERS_PROFILE: ${{ secrets.FEWPAPERS_PROFILE }}
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m fewpapers
      - name: Commit candidates
        if: ${{ !cancelled() && hashFiles('output/latest.md') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "candidates $(date -u +%F)"
            git push
          fi
