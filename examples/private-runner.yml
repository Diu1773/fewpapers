# Private runner: copy into a private repository as .github/workflows/daily.yml.
# Secrets: FEWPAPERS_PROFILE, GIST_TOKEN (classic token with only the gist scope).
# Variable: GIST_ID (an existing secret gist; latest.md is replaced after each run).
name: daily candidates

on:
  schedule:
    - cron: "23 17 * * *"   # 17:23 UTC; scheduled runs can start hours late, so leave room before the morning read
  workflow_dispatch:
    inputs:
      no_state:
        description: "do not read or update the seen list (test run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ vars.GIST_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Diu1773/fewpapers
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and pre-filter
        env:
          FEWPAPERS_PROFILE: ${{ secrets.FEWPAPERS_PROFILE }}
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PYTHONPATH: code
        run: python -m fewpapers collect --out output --state state/seen.json ${{ inputs.no_state && '--no-state' || '' }}
      - name: Commit candidates
        if: ${{ !cancelled() && !inputs.no_state && hashFiles('output/latest.md') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "candidates $(date -u +%F)"
            git push
          fi
      - name: Publish latest.md to the secret gist
        if: ${{ !cancelled() && env.GIST_TOKEN != '' && env.GIST_ID != '' && hashFiles('output/latest.md') != '' }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body = json.dumps({"files": {"latest.md": {"content": open("output/latest.md", encoding="utf-8").read()}}}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/gists/{os.environ['GIST_ID']}", data=body, method="PATCH",
              headers={"Authorization": f"Bearer {os.environ['GIST_TOKEN']}", "Accept": "application/vnd.github+json"})
          import time
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      print("gist updated", r.status)
                  break
              except Exception as e:
                  print("gist attempt", attempt + 1, "failed:", e)
                  if attempt == 4:
                      raise
                  time.sleep(30 * (attempt + 1))
          PY
