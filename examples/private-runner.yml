# Private runner: copy into a private repository as .github/workflows/daily.yml.
# Secret: FEWPAPERS_PROFILE. The assistant reads output/latest.md through its GitHub app.
name: daily candidates

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC; scheduled runs have started up to ten hours late, so leave room before the morning read
  workflow_dispatch:
    inputs:
      no_state:
        description: "do not read or update the seen list (test run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Diu1773/fewpapers
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and pre-filter
        env:
          FEWPAPERS_PROFILE: ${{ secrets.FEWPAPERS_PROFILE }}
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PYTHONPATH: code
        run: python -m fewpapers collect --out output --state state/seen.json ${{ inputs.no_state && '--no-state' || '' }}
      - name: Commit candidates
        if: ${{ !cancelled() && !inputs.no_state && hashFiles('output/latest.md') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "candidates $(date -u +%F)"
            git push
          fi
